<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALTと話そう！英会話トレーニング</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;

  /* 真っ白ではなく、目にやさしい背景 */
  background:#f3f0e8;

  color:#333;

  min-height:100vh;
}

button,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}


/* =====================================
   はじめの画面
===================================== */

#startScreen{
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:30px 20px;
}

.startBox{
  width:min(620px, 100%);

  background:#fffdf8;

  border:1px solid #d8d3c8;
  border-radius:12px;

  padding:42px 30px 36px;

  text-align:center;
}

.startTitle{
  font-size:clamp(28px, 6vw, 42px);

  font-weight:700;

  margin:0 0 8px;

  letter-spacing:0.04em;
}

.startSubTitle{
  font-size:18px;

  color:#666;

  margin-bottom:36px;
}

.startDescription{
  font-size:16px;

  line-height:1.9;

  margin-bottom:30px;

  color:#555;
}

.startButtons{
  display:flex;

  flex-direction:column;

  gap:12px;

  max-width:360px;

  margin:0 auto;
}

.startButtons button{
  width:100%;

  padding:15px 20px;

  border:1px solid #aaa;

  border-radius:7px;

  background:#fffdf8;

  color:#333;

  font-size:17px;
}

.startButtons button:hover{
  background:#f1eee7;
}

#startButton{
  background:#444;

  color:white;

  border-color:#444;
}

#startButton:hover{
  background:#333;
}

.soundMessage{
  min-height:28px;

  margin-top:18px;

  font-size:14px;

  color:#666;
}


/* =====================================
   練習画面
===================================== */

#practiceScreen{
  display:none;

  min-height:100vh;

  padding-bottom:40px;
}

.header{
  background:#fffdf8;

  border-bottom:1px solid #d8d3c8;

  padding:14px 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;
}

.headerTitle{
  font-size:20px;

  font-weight:700;

  white-space:nowrap;
}

.progress{
  font-size:14px;

  color:#666;

  white-space:nowrap;
}

.main{
  width:min(760px, calc(100% - 30px));

  margin:25px auto 0;
}


/* =====================================
   単元選択
===================================== */

.unitArea{
  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:18px;
}

.unitArea label{
  font-size:14px;

  color:#555;
}

#unitSelect{
  padding:8px 32px 8px 10px;

  border:1px solid #bdb8ae;

  border-radius:6px;

  background:#fffdf8;

  font-size:15px;

  color:#333;
}


/* =====================================
   問題カード
===================================== */

.questionCard{
  background:#fff;

  border:1px solid #d6d1c7;

  border-radius:12px;

  padding:30px 25px 25px;

  text-align:center;
}

.questionLabel{
  font-size:15px;

  color:#777;

  margin-bottom:18px;
}

.question{
  min-height:58px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:clamp(28px, 6vw, 42px);

  font-weight:700;

  line-height:1.4;

  margin-bottom:8px;
}

.questionJa{
  min-height:32px;

  font-size:19px;

  color:#555;

  line-height:1.6;

  margin-bottom:24px;
}


/* =====================================
   速度
===================================== */

.speedArea{
  margin:0 auto 20px;

  font-size:14px;

  color:#666;
}

.speedArea label{
  margin:0 8px;
}

.speedArea input{
  margin-right:4px;
}


/* =====================================
   状態表示
===================================== */

.listenStatus{
  min-height:24px;

  margin-bottom:15px;

  font-size:14px;

  color:#777;
}


/* =====================================
   回答
===================================== */

.answerBox{
  text-align:left;

  border-top:1px solid #eee;

  padding-top:20px;
}

.answerTitle{
  font-size:15px;

  font-weight:700;

  margin-bottom:10px;
}

.voiceText{
  min-height:58px;

  padding:14px 16px;

  border:1px solid #ddd;

  border-radius:7px;

  background:#faf9f5;

  font-size:19px;

  line-height:1.6;

  word-break:break-word;
}


/* =====================================
   判定結果
===================================== */

#judgeResult{
  min-height:44px;

  display:flex;

  align-items:center;

  justify-content:center;

  margin:18px 0 4px;

  font-size:22px;

  font-weight:700;
}

.resultCorrect{
  color:#26734d;
}

.resultWrong{
  color:#b33a3a;
}


/* =====================================
   答え方の例
===================================== */

.exampleBox{
  display:block;

  margin-top:18px;

  padding:16px;

  background:#f7f5ef;

  border:1px solid #ded9cf;

  border-radius:7px;

  text-align:left;
}

.exampleTitle{
  font-size:14px;

  color:#666;

  margin-bottom:7px;
}

#exampleAnswer{
  font-size:18px;

  line-height:1.6;
}


/* =====================================
   ボタン
===================================== */

.buttons{
  display:grid;

  grid-template-columns:1fr 1fr 1fr;

  gap:10px;

  margin-top:22px;
}

.buttons button{
  min-height:48px;

  padding:10px 8px;

  border:1px solid #aaa;

  border-radius:7px;

  background:#fffdf8;

  color:#333;

  font-size:15px;
}

.buttons button:hover{
  background:#f1eee7;
}

#judgeButton{
  background:#444;

  color:white;

  border-color:#444;
}

#judgeButton:hover{
  background:#333;
}


/* =====================================
   スマートフォン
===================================== */

@media(max-width:600px){

  #startScreen{
    padding:20px 15px;
  }

  .startBox{
    padding:32px 20px 28px;
  }

  .header{
    padding:12px 15px;
  }

  .headerTitle{
    font-size:17px;
  }

  .progress{
    font-size:13px;
  }

  .main{
    width:calc(100% - 20px);

    margin-top:15px;
  }

  .questionCard{
    padding:25px 16px 20px;
  }

  .unitArea{
    margin-bottom:12px;
  }

  .question{
    font-size:30px;
  }

  .questionJa{
    font-size:17px;
  }

  .buttons{
    grid-template-columns:1fr 1fr;
  }

  .buttons button:last-child{
    grid-column:1 / -1;
  }

  .voiceText{
    font-size:17px;
  }

}


/* =====================================
   小さい画面
===================================== */

@media(max-width:380px){

  .question{
    font-size:27px;
  }

  .buttons button{
    font-size:14px;
  }

}

</style>
</head>


<body>


<!-- =====================================
     はじめの画面
===================================== -->

<div id="startScreen">

  <div class="startBox">

    <h1 class="startTitle">
      ALTと話そう！
    </h1>

    <div class="startSubTitle">
      英会話トレーニング
    </div>

    <div class="startDescription">
      英語の質問を聞いて、<br>
      英語で答えてみましょう。
    </div>

    <div class="startButtons">

      <button id="soundButton">
        音声を確認
      </button>

      <button id="micButton">
        マイクを許可
      </button>

      <button id="startButton">
        練習を始める
      </button>

    </div>

    <div
      id="soundMessage"
      class="soundMessage">
    </div>

  </div>

</div>



<!-- =====================================
     練習画面
===================================== -->

<div id="practiceScreen">


  <header class="header">

    <div class="headerTitle">
      ALTと話そう！
    </div>

    <div
      id="progress"
      class="progress">
      1 / 15
    </div>

  </header>


  <main class="main">


    <!-- 単元選択 -->

    <div class="unitArea">

      <label for="unitSelect">
        練習する質問
      </label>

      <select id="unitSelect">

        <option value="all">
          全部
        </option>

        <option value="What">
          What
        </option>

        <option value="Where">
          Where
        </option>

        <option value="When">
          When
        </option>

      </select>

    </div>



    <!-- 問題カード -->

    <section class="questionCard">


      <div class="questionLabel">
        英語で答えてみよう！
      </div>


      <!--
        最初は？？？だけ表示。
        英語の質問は音声でのみ提示。
      -->

      <div
        id="question"
        class="question">
        ？？？
      </div>


      <!--
        日本語訳も最初は非表示。
        「もう一回聞く」で表示。
      -->

      <div
        id="questionJa"
        class="questionJa">
      </div>



      <!-- 速度 -->

      <div class="speedArea">

        話す速さ：

        <label>
          <input
            type="radio"
            name="speed"
            value="1"
            checked
          >
          ナチュラル
        </label>

        <label>
          <input
            type="radio"
            name="speed"
            value="0.75"
          >
          ゆっくり
        </label>

      </div>



      <!-- 状態 -->

      <div
        id="listenStatus"
        class="listenStatus">

        質問を聞いてください。

      </div>



      <!-- あなたの答え -->

      <div class="answerBox">

        <div class="answerTitle">
          あなたの答え
        </div>

        <div
          id="voiceText"
          class="voiceText">

          ここに英語が表示されます

        </div>

      </div>



      <!-- 判定結果 -->

      <div id="judgeResult">
      </div>



      <!-- 答え方の例 -->

      <div class="exampleBox">

        <div class="exampleTitle">
          答え方の例
        </div>

        <div id="exampleAnswer">
        </div>

      </div>



      <!-- ボタン -->

      <div class="buttons">

        <button id="repeatButton">
          もう一回聞く
        </button>

        <button id="judgeButton">
          判定
        </button>

        <button id="nextButton">
          次の質問
        </button>

      </div>


    </section>

  </main>

</div>



<!-- =====================================
     データファイル
===================================== -->

<script src="conversationData.js"></script>


<script>

/* =====================================
   データを取得
===================================== */

/*
  conversationData.js の書き方によって
  データの名前が違っても対応できるようにする。

  まず conversationData、
  次に data を探す。
*/

let allConversationData = null;


if(
  Array.isArray(window.conversationData)
){

  allConversationData =
    window.conversationData;

}


else if(
  Array.isArray(window.data)
){

  allConversationData =
    window.data;

}


else if(
  typeof conversationData !== "undefined" &&
  Array.isArray(conversationData)
){

  allConversationData =
    conversationData;

}


/*
  データが見つからなかった場合だけ
  エラーを表示する。
*/

if(!allConversationData){

  console.error(
    "conversationData.js のデータが見つかりません。"
  );

}



/* =====================================
   基本設定
===================================== */

let currentData = [];

let current = 0;

let recognition = null;

let shouldListen = false;

let isJudging = false;



/* =====================================
   HTML要素
===================================== */

const startScreen =
  document.getElementById(
    "startScreen"
  );

const practiceScreen =
  document.getElementById(
    "practiceScreen"
  );

const soundButton =
  document.getElementById(
    "soundButton"
  );

const micButton =
  document.getElementById(
    "micButton"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const soundMessage =
  document.getElementById(
    "soundMessage"
  );

const unitSelect =
  document.getElementById(
    "unitSelect"
  );

const question =
  document.getElementById(
    "question"
  );

const questionJa =
  document.getElementById(
    "questionJa"
  );

const voiceText =
  document.getElementById(
    "voiceText"
  );

const judgeResult =
  document.getElementById(
    "judgeResult"
  );

const exampleAnswer =
  document.getElementById(
    "exampleAnswer"
  );

const repeatButton =
  document.getElementById(
    "repeatButton"
  );

const judgeButton =
  document.getElementById(
    "judgeButton"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const listenStatus =
  document.getElementById(
    "listenStatus"
  );

const progress =
  document.getElementById(
    "progress"
  );



/* =====================================
   話す速さ
===================================== */

let selectedRate = 1.0;


document
  .querySelectorAll(
    'input[name="speed"]'
  )
  .forEach(function(radio){

    radio.addEventListener(
      "change",
      function(){

        selectedRate =
          Number(this.value);

      }
    );

  });



/* =====================================
   音声確認
===================================== */

soundButton.addEventListener(
  "click",
  function(){

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        "Hello."
      );

    utterance.lang =
      "en-US";

    utterance.rate =
      selectedRate;

    speechSynthesis.speak(
      utterance
    );

    soundMessage.textContent =
      "音声が聞こえたらOKです。";

  }
);



/* =====================================
   マイク許可
===================================== */

micButton.addEventListener(
  "click",
  function(){

    if(
      !("webkitSpeechRecognition" in window) &&
      !("SpeechRecognition" in window)
    ){

      soundMessage.textContent =
        "このブラウザでは音声認識を利用できません。";

      return;

    }


    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    const testRecognition =
      new SpeechRecognition();


    testRecognition.lang =
      "en-US";

    testRecognition.continuous =
      false;

    testRecognition.interimResults =
      false;


    testRecognition.onstart =
      function(){

        soundMessage.textContent =
          "マイクを使用できます。";

        try{

          testRecognition.stop();

        }catch(e){}

      };


    testRecognition.onerror =
      function(event){

        if(
          event.error ===
          "not-allowed"
        ){

          soundMessage.textContent =
            "マイクの使用が許可されていません。ブラウザの設定を確認してください。";

        }

        else{

          soundMessage.textContent =
            "マイクを確認できませんでした。";

        }

      };


    try{

      testRecognition.start();

    }catch(e){

      soundMessage.textContent =
        "マイクの確認ができませんでした。";

    }

  }
);



/* =====================================
   練習開始
===================================== */

startButton.addEventListener(
  "click",
  function(){

    startPractice();

  }
);



function startPractice(){

  if(!allConversationData){

    alert(
      "conversationData.js のデータを読み込めませんでした。"
    );

    return;

  }


  startScreen.style.display =
    "none";

  practiceScreen.style.display =
    "block";


  prepareData();

  current = 0;

  showQuestion();

}



/* =====================================
   データ準備
===================================== */

function prepareData(){

  const selected =
    unitSelect.value;


  if(selected === "all"){

    currentData =
      [...allConversationData];

  }

  else{

    currentData =
      allConversationData.filter(
        function(item){

          return item.unit === selected;

        }
      );

  }


  /*
    問題をシャッフル
  */

  currentData.sort(
    () => Math.random() - 0.5
  );

}



/* =====================================
   単元変更
===================================== */

unitSelect.addEventListener(
  "change",
  function(){

    stopListening();

    speechSynthesis.cancel();

    prepareData();

    current = 0;

    showQuestion();

  }
);



/* =====================================
   問題表示
===================================== */

function showQuestion(){

  stopListening();

  speechSynthesis.cancel();

  isJudging = false;


  if(current >= currentData.length){

    current = 0;

  }


  const item =
    currentData[current];


  /*
    新しい問題では
    英語も日本語も隠す。
  */

  question.textContent =
    "？？？";

  questionJa.textContent =
    "";


  /*
    答え方の例は最初から表示。
  */

  exampleAnswer.textContent =
    item.example || "";


  /*
    回答欄をリセット。
  */

  voiceText.textContent =
    "ここに英語が表示されます";


  judgeResult.textContent =
    "";

  judgeResult.className =
    "";


  /*
    進み具合。
  */

  progress.textContent =
    (current + 1) +
    " / " +
    currentData.length;


  listenStatus.textContent =
    "質問を聞いてください。";


  /*
    少し待って質問を読み上げる。
  */

  setTimeout(
    function(){

      speakQuestion();

    },
    300
  );

}



/* =====================================
   質問を読み上げる
===================================== */

function speakQuestion(){

  if(!currentData[current]){
    return;
  }


  stopListening();

  speechSynthesis.cancel();


  const item =
    currentData[current];


  const utterance =
    new SpeechSynthesisUtterance(
      item.question
    );


  utterance.lang =
    "en-US";

  utterance.rate =
    selectedRate;


  utterance.onstart =
    function(){

      listenStatus.textContent =
        "質問を聞いてください。";

    };


  /*
    質問を読み終わったら
    自動的に聞き取り開始。
  */

  utterance.onend =
    function(){

      if(!isJudging){

        startListening();

      }

    };


  speechSynthesis.speak(
    utterance
  );

}



/* =====================================
   もう一回聞く
===================================== */

repeatButton.addEventListener(
  "click",
  function(){

    if(!currentData[current]){
      return;
    }


    const item =
      currentData[current];


    /*
      ここで初めて
      英語と日本語を表示。
    */

    question.textContent =
      item.question;

    questionJa.textContent =
      item.questionJa || "";


    /*
      判定をリセット。
    */

    isJudging = false;

    judgeResult.textContent =
      "";

    judgeResult.className =
      "";


    voiceText.textContent =
      "ここに英語が表示されます";


    /*
      もう一度質問を読み上げる。
    */

    speakQuestion();

  }
);



/* =====================================
   音声認識の準備
===================================== */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "このブラウザでは音声認識を利用できません。Chromeを使用してください。"
    );

    return false;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  /*
    連続認識。
  */

  recognition.continuous =
    true;

  recognition.interimResults =
    false;


  recognition.onstart =
    function(){

      if(!isJudging){

        shouldListen = true;

        listenStatus.textContent =
          "答えを話してください。";

      }

    };


  recognition.onresult =
    function(event){

      let text = "";


      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        if(
          event.results[i].isFinal
        ){

          text +=
            event.results[i][0].transcript;

        }

      }


      if(text.trim()){

        voiceText.textContent =
          text.trim();

      }

    };


  recognition.onerror =
    function(event){

      if(
        event.error === "not-allowed" ||
        event.error === "service-not-allowed"
      ){

        shouldListen = false;

        listenStatus.textContent =
          "マイクの使用が許可されていません。";

        return;

      }


      if(
        event.error === "no-speech" ||
        event.error === "aborted"
      ){

        return;

      }

    };


  recognition.onend =
    function(){

      /*
        判定していない間は
        認識を再開する。

        子どもが考えている時間が長くても
        できるだけ待つ。
      */

      if(
        shouldListen &&
        !isJudging
      ){

        setTimeout(
          function(){

            try{

              recognition.start();

            }catch(e){

            }

          },
          500
        );

      }

    };


  return true;

}



/* =====================================
   音声認識開始
===================================== */

function startListening(){

  if(isJudging){
    return;
  }


  if(!recognition){

    const ok =
      setupRecognition();

    if(!ok){
      return;
    }

  }


  shouldListen = true;


  try{

    recognition.start();

  }catch(e){

  }

}



/* =====================================
   音声認識停止
===================================== */

function stopListening(){

  shouldListen = false;


  if(recognition){

    try{

      recognition.stop();

    }catch(e){}

  }

}



/* =====================================
   正規化
===================================== */

function normalize(text){

  return text

    .toLowerCase()

    .replace(
      /[.,!?'"’“”]/g,
      ""
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}



/* =====================================
   判定
===================================== */

judgeButton.addEventListener(
  "click",
  function(){

    judgeAnswer();

  }
);



function judgeAnswer(){

  if(!currentData[current]){
    return;
  }


  isJudging = true;

  stopListening();


  const userText =
    normalize(
      voiceText.textContent
    );


  if(
    !userText ||
    userText ===
    "ここに英語が表示されます"
  ){

    judgeResult.textContent =
      "❌ もう一度話してみましょう";

    judgeResult.className =
      "resultWrong";

    return;

  }


  const item =
    currentData[current];


  /*
    patterns があれば複数、
    なければ pattern 1つ。
  */

  const patterns =
    item.patterns ||
    [item.pattern];


  let correct =
    false;


  for(
    const pattern of patterns
  ){

    const p =
      normalize(pattern);


    /*
      例：

      I want a ball.

      pattern = I want

      → 正解

      I want

      → 内容がないので不正解
    */

    if(
      userText.startsWith(
        p + " "
      ) &&
      userText.length > p.length
    ){

      correct =
        true;

      break;

    }

  }


  if(correct){

    judgeResult.textContent =
      "◎ いい答えです！";

    judgeResult.className =
      "resultCorrect";


    speakExample();

  }

  else{

    judgeResult.textContent =
      "❌ もう一度練習してみましょう";

    judgeResult.className =
      "resultWrong";

  }

}



/* =====================================
   答え方の例を読み上げる
===================================== */

function speakExample(){

  if(!currentData[current]){
    return;
  }


  const item =
    currentData[current];


  if(!item.example){
    return;
  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      item.example
    );


  utterance.lang =
    "en-US";

  utterance.rate =
    selectedRate;


  speechSynthesis.speak(
    utterance
  );

}
