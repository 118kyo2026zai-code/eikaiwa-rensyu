  }

<!-- =========================
     会話データ
========================= -->

<script src="conversationData.js"></script>



<script>

/* =========================
   データ読み込み
========================= */

let allConversationData = null;


if(Array.isArray(window.conversationData)){

  allConversationData =
    window.conversationData;

}
else if(Array.isArray(window.data)){

  allConversationData =
    window.data;

}
else if(
  typeof conversationData !== "undefined" &&
  Array.isArray(conversationData)
){

  allConversationData =
    conversationData;

}
else if(
  typeof data !== "undefined" &&
  Array.isArray(data)
){

  allConversationData =
    data;

}



/* =========================
   データ確認
========================= */

if(!Array.isArray(allConversationData)){

  alert(
    "conversationData.js のデータを読み込めませんでした。"
  );

}



/* =========================
   変数
========================= */

let currentData = [];

let currentIndex = 0;

let currentItem = null;

let recognition = null;

let shouldListen = false;

let isJudging = false;

let recognizedText = "";

let voiceChecked = false;



/* =========================
   要素
========================= */

const startScreen =
  document.getElementById("startScreen");

const practiceScreen =
  document.getElementById("practiceScreen");

const testVoiceButton =
  document.getElementById("testVoiceButton");

const permissionButton =
  document.getElementById("permissionButton");

const startButton =
  document.getElementById("startButton");

const startStatus =
  document.getElementById("startStatus");

const unitSelect =
  document.getElementById("unitSelect");

const question =
  document.getElementById("question");

const questionJa =
  document.getElementById("questionJa");

const status =
  document.getElementById("status");

const recognizedTextElement =
  document.getElementById("recognizedText");

const exampleAnswer =
  document.getElementById("exampleAnswer");

const judgeResult =
  document.getElementById("judgeResult");

const repeatButton =
  document.getElementById("repeatButton");

const judgeButton =
  document.getElementById("judgeButton");

const nextButton =
  document.getElementById("nextButton");

const progress =
  document.getElementById("progress");



/* =========================
   音声速度
========================= */

function getSpeechRate(){

  const selected =
    document.querySelector(
      'input[name="speed"]:checked'
    );

  if(!selected){

    return 1;

  }

  return Number(selected.value);

}



/* =========================
   テキスト正規化
========================= */

function normalize(text){

  return text
    .toLowerCase()
    .replace(/[.,!?'"’“”]/g, "")
    .replace(/\s+/g, " ")
    .trim();

}



/* =========================
   音声読み上げ
========================= */

function speakText(text, callback){

  if(!text){

    if(callback){

      callback();

    }

    return;

  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);


  utterance.lang =
    "en-US";


  utterance.rate =
    getSpeechRate();


  utterance.onend =
    function(){

      if(callback){

        callback();

      }

    };


  window.speechSynthesis.speak(
    utterance
  );

}



/* =========================
   音声確認
========================= */

testVoiceButton.addEventListener(
  "click",
  function(){

    /*
     * 音声確認中
     */

    startStatus.textContent =
      "音声確認中。しばらくおまちください・・・";


    testVoiceButton.disabled =
      true;


    /*
     * 確認用の短い音声
     *
     * 英語の練習とは関係ない
     * 確認専用の音声です。
     */

    const utterance =
      new SpeechSynthesisUtterance(
        "Hello."
      );


    utterance.lang =
      "en-US";


    utterance.rate =
      1;


    utterance.onend =
      function(){

        /*
         * 音声確認完了
         */

        voiceChecked =
          true;


        startStatus.textContent =
          "音声を確認しました。練習を始められます。";


        /*
         * 練習開始ボタンを有効にする
         */

        startButton.disabled =
          false;


        testVoiceButton.disabled =
          false;

      };


    utterance.onerror =
      function(){

        voiceChecked =
          false;


        startStatus.textContent =
          "音声を確認できませんでした。もう一度お試しください。";


        testVoiceButton.disabled =
          false;

      };


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
      utterance
    );

  }
);



/* =========================
   マイク許可
========================= */

permissionButton.addEventListener(
  "click",
  async function(){

    startStatus.textContent =
      "マイクの確認中です・・・";


    try{

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });


      stream
        .getTracks()
        .forEach(
          function(track){

            track.stop();

          }
        );


      startStatus.textContent =
        "マイクを使用できます。";


    }
    catch(error){

      startStatus.textContent =
        "マイクが許可されていません。";


      alert(
        "マイクが許可されていません。\n" +
        "ブラウザの設定を確認してください。"
      );

    }

  }
);



/* =========================
   音声認識
========================= */

if(
  "webkitSpeechRecognition" in window ||
  "SpeechRecognition" in window
){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.continuous =
    true;


  recognition.interimResults =
    false;



  recognition.onresult =
    function(event){

      let text = "";


      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        if(
          event.results[i].isFinal
        ){

          text +=
            event.results[i][0].transcript +
            " ";

        }

      }


      text =
        text.trim();


      if(text){

        recognizedText =
          (
            recognizedText +
            " " +
            text
          ).trim();


        recognizedTextElement.textContent =
          recognizedText;

      }

    };



  recognition.onend =
    function(){

      if(
        shouldListen &&
        !isJudging
      ){

        setTimeout(
          function(){

            try{

              recognition.start();

            }
            catch(error){

            }

          },
          500
        );

      }

    };



  recognition.onerror =
    function(event){

      if(
        event.error === "not-allowed"
      ){

        status.textContent =
          "マイクが許可されていません。";

      }
      else if(
        event.error === "no-speech"
      ){

        status.textContent =
          "声が聞こえませんでした。";

      }

    };

}



/* =========================
   認識開始
========================= */

function startRecognition(){

  if(!recognition){

    return;

  }


  shouldListen =
    true;


  isJudging =
    false;


  recognizedText =
    "";


  recognizedTextElement.textContent =
    "";


  status.textContent =
    "話してください。";


  try{

    recognition.start();

  }
  catch(error){

  }

}



/* =========================
   認識停止
========================= */

function stopRecognition(){

  shouldListen =
    false;


  if(recognition){

    try{

      recognition.stop();

    }
    catch(error){

    }

  }

}



/* =========================
   練習開始
========================= */

startButton.addEventListener(
  "click",
  function(){

    /*
     * 音声確認が終わっていなければ
     * 練習を開始しない
     */

    if(!voiceChecked){

      return;

    }


    if(
      !Array.isArray(allConversationData) ||
      allConversationData.length === 0
    ){

      alert(
        "会話データが読み込まれていません。"
      );

      return;

    }


    /*
     * スタート画面を閉じる
     */

    startScreen.style.display =
      "none";


    /*
     * 練習画面を表示
     */

    practiceScreen.style.display =
      "block";


    /*
     * 問題を作る
     */

    makeQuestionList();


    /*
     * 第1問を表示・読み上げる
     */

    showQuestion();

  }
);



/* =========================
   問題リスト作成
========================= */

function makeQuestionList(){

  const unit =
    unitSelect.value;


  if(unit === "all"){

    currentData =
      [...allConversationData];

  }
  else{

    currentData =
      allConversationData.filter(
        function(item){

          return item.unit === unit;

        }
      );

  }


  currentIndex =
    0;

}



/* =========================
   単元変更
========================= */

unitSelect.addEventListener(
  "change",
  function(){

    stopRecognition();

    window.speechSynthesis.cancel();

    makeQuestionList();

    showQuestion();

  }
);



/* =========================
   問題表示
========================= */

function showQuestion(){

  stopRecognition();

  window.speechSynthesis.cancel();


  isJudging =
    false;


  recognizedText =
    "";


  judgeResult.textContent =
    "";


  judgeResult.className =
    "judgeResult";


  recognizedTextElement.textContent =
    "";


  status.textContent =
    "";


  currentItem =
    currentData[currentIndex];


  if(!currentItem){

    return;

  }


  /*
   * 英語の質問は最初は隠す
   */

  question.textContent =
    "？？？";


  /*
   * 日本語も最初は隠す
   */

  questionJa.textContent =
    "";


  /*
   * 答え方の例は最初から表示
   */

  exampleAnswer.textContent =
    currentItem.example || "";


  /*
   * 進み具合
   */

  progress.textContent =
    (currentIndex + 1) +
    " / " +
    currentData.length;


  /*
   * ここでは確認音声は流さない。
   *
   * いきなり第1問を読み上げる。
   *
   * 質問を読み終わってから
   * マイクを開始する。
   */

  speakQuestion(
    function(){

      if(!isJudging){

        startRecognition();

      }

    }
  );

}



/* =========================
   質問読み上げ
========================= */

function speakQuestion(callback){

  if(!currentItem){

    return;

  }


  speakText(
    currentItem.question,
    callback
  );

}



/* =========================
   例文読み上げ
========================= */

function speakExample(){

  if(!currentItem){

    return;

  }


  speakText(
    currentItem.example || ""
  );

}



/* =========================
   もう一回聞く
========================= */

repeatButton.addEventListener(
  "click",
  function(){

    if(!currentItem){

      return;

    }


    stopRecognition();

    window.speechSynthesis.cancel();


    isJudging =
      false;


    /*
     * もう一回聞くを押したら
     * 英語を表示
     */

    question.textContent =
      currentItem.question;


    /*
     * 日本語も表示
     */

    questionJa.textContent =
      currentItem.questionJa || "";


    /*
     * 質問を読み上げる
     */

    speakQuestion(
      function(){

        if(!isJudging){

          startRecognition();

        }

      }
    );

  }
);



/* =========================
   時間表現チェック
========================= */

function hasTimeExpression(text){

  const t =
    normalize(text);


  /*
   * at seven
   * at seven thirty
   * at 7
   */

  if(
    /\bat\s+(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|\d{1,2})\b/.test(t)
  ){

    return true;

  }


  /*
   * in the morning
   * in the afternoon
   * in the evening
   * at night
   */

  if(
    /\b(in the morning|in the afternoon|in the evening|at night)\b/.test(t)
  ){

    return true;

  }


  /*
   * every day
   * every morning
   * every night
   */

  if(
    /\bevery\s+(day|morning|afternoon|evening|night|week)\b/.test(t)
  ){

    return true;

  }


  /*
   * on Monday など
   */

  if(
    /\bon\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/.test(t)
  ){

    return true;

  }


  /*
   * today / tomorrow / tonight / yesterday
   */

  if(
    /\b(today|tomorrow|tonight|yesterday)\b/.test(t)
  ){

    return true;

  }


  return false;

}



/* =========================
   場所表現チェック
========================= */

function hasPlaceExpression(text){

  const t =
    normalize(text);


  /*
   * in Japan
   * in Fukuoka
   * in my room
   */

  if(
    /\bin\s+[a-z]+/.test(t)
  ){

    return true;

  }


  /*
   * at school
   * at home
   * at the park
   */

  if(
    /\bat\s+(school|home|the|a|my)\b/.test(t)
  ){

    return true;

  }


  /*
   * on the desk
   * on the table
   */

  if(
    /\bon\s+(the|my|a)\b/.test(t)
  ){

    return true;

  }


  const places = [

    "school",
    "home",
    "park",
    "library",
    "store",
    "shop",
    "station",
    "classroom",
    "room",
    "house",
    "fukuoka",
    "japan"

  ];


  for(
    const place of places
  ){

    const regex =
      new RegExp(
        "\\b" +
        place +
        "\\b"
      );


    if(regex.test(t)){

      return true;

    }

  }


  return false;

}



/* =========================
   Whatの答えチェック
========================= */

function hasWhatAnswer(text){

  const t =
    normalize(text);


  /*
   * 時間になっていたら
   * Whatの答えとしては×
   */

  if(hasTimeExpression(t)){

    return false;

  }


  /*
   * 場所になっていたら
   * Whatの答えとしては×
   */

  if(hasPlaceExpression(t)){

    return false;

  }


  return true;

}



/* =========================
   答えの判定
========================= */

function judgeAnswer(){

  stopRecognition();

  window.speechSynthesis.cancel();


  isJudging =
    true;


  const userText =
    normalize(recognizedText);


  /*
   * 何も話していない
   */

  if(!userText){

    judgeResult.textContent =
      "❌ もう一度話してみましょう";


    judgeResult.className =
      "judgeResult resultWrong";


    return;

  }


  const patterns =
    currentItem.patterns ||
    [currentItem.pattern];


  let patternMatched =
    false;


  /*
   * 基本の答え方を確認
   */

  for(
    const pattern of patterns
  ){

    const p =
      normalize(pattern);


    if(
      userText === p ||
      userText.startsWith(
        p + " "
      )
    ){

      patternMatched =
        true;

      break;

    }

  }


  let correct =
    false;


  /*
   * 基本パターンが違えば×
   */

  if(!patternMatched){

    correct =
      false;

  }
  else{


    /*
     * =====================
     * When
     * =====================
     */

    if(
      currentItem.answerType === "time"
    ){

      correct =
        hasTimeExpression(
          userText
        );

    }


    /*
     * =====================
     * Where
     * =====================
     */

    else if(
      currentItem.answerType === "place"
    ){

      correct =
        hasPlaceExpression(
          userText
        );

    }


    /*
     * =====================
     * What
     * =====================
     */

    else if(
      currentItem.answerType === "thing"
    ){

      correct =
        hasWhatAnswer(
          userText
        );

    }


    /*
     * その他
     */

    else{

      correct =
        true;

    }

  }


  /*
   * =====================
   * 正解
   * =====================
   */

  if(correct){

    judgeResult.textContent =
      "◎ いい答えです！";


    judgeResult.className =
      "judgeResult resultCorrect";


    /*
     * 1.2秒待ってから
     * 答え方の例を読み上げる
     */

    setTimeout(
      function(){

        if(!isJudging){

          return;

        }


        speakExample();

      },
      1200
    );

  }


  /*
   * =====================
   * 不正解
   * =====================
   */

  else{

    judgeResult.textContent =
      "❌ もう一度練習してみましょう";


    judgeResult.className =
      "judgeResult resultWrong";

  }

}



/* =========================
   判定ボタン
========================= */

judgeButton.addEventListener(
  "click",
  function(){

    judgeAnswer();

  }
);



/* =========================
   次の質問
========================= */

nextButton.addEventListener(
  "click",
  function(){

    stopRecognition();

    window.speechSynthesis.cancel();


    if(
      currentIndex <
      currentData.length - 1
    ){

      currentIndex++;

      showQuestion();

    }
    else{

      alert(
        "この単元は終了です！"
      );


      currentIndex =
        0;


      showQuestion();

    }

  }
);

</script>
