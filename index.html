<script>

/* =========================================
   基本設定
========================================= */

let questions = [];

let currentIndex = 0;

let currentItem = null;

let recognition = null;

let isListening = false;

let isJudging = false;

let voiceChecked = false;

let checkingVoice = false;



/* =========================================
   画面要素
========================================= */

const startScreen =
  document.getElementById("startScreen");

const practiceScreen =
  document.getElementById("practiceScreen");

const testVoiceButton =
  document.getElementById("testVoiceButton");

const permissionButton =
  document.getElementById("permissionButton");

const startButton =
  document.getElementById("startButton");

const startStatus =
  document.getElementById("startStatus");

const step1 =
  document.getElementById("step1");

const step2 =
  document.getElementById("step2");

const step3 =
  document.getElementById("step3");

const unitSelect =
  document.getElementById("unitSelect");

const questionEnglish =
  document.getElementById("questionEnglish");

const questionJapanese =
  document.getElementById("questionJapanese");

const recognizedText =
  document.getElementById("recognizedText");

const result =
  document.getElementById("result");

const exampleBox =
  document.getElementById("exampleBox");

const exampleText =
  document.getElementById("exampleText");

const progress =
  document.getElementById("progress");

const judgeButton =
  document.getElementById("judgeButton");

const nextButton =
  document.getElementById("nextButton");

const repeatButton =
  document.getElementById("repeatButton");



/* =========================================
   状態表示
========================================= */

function setStartStatus(text, type=""){

  startStatus.textContent = text;

  startStatus.className =
    "status" +
    (type ? " " + type : "");

}



/* =========================================
   音声確認
========================================= */

testVoiceButton.addEventListener(
  "click",
  function(){

    if(checkingVoice){

      return;

    }


    checkingVoice = true;

    testVoiceButton.disabled = true;


    step1.classList.add("active");


    setStartStatus(
      "音声確認中。しばらくおまちください・・・",
      "checking"
    );


    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        "Hello."
      );


    utterance.lang = "en-US";

    utterance.rate = 1.0;


    utterance.onend = function(){

      checkingVoice = false;

      voiceChecked = true;

      testVoiceButton.disabled = false;


      step1.classList.remove("active");

      step2.classList.add("active");

      step3.classList.add("active");


      setStartStatus(
        "音声を確認しました。次に「マイクを許可」を押してください。",
        "success"
      );


      startButton.disabled = false;

    };


    utterance.onerror = function(){

      checkingVoice = false;

      testVoiceButton.disabled = false;


      setStartStatus(
        "音声を確認できませんでした。もう一度お試しください。",
        "error"
      );

    };


    speechSynthesis.speak(
      utterance
    );

  }
);



/* =========================================
   マイク許可
========================================= */

permissionButton.addEventListener(
  "click",
  async function(){

    try{

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });


      stream
        .getTracks()
        .forEach(function(track){

          track.stop();

        });


      if(checkingVoice){

        return;

      }


      setStartStatus(
        "マイクを使用できます。準備ができました。",
        "success"
      );


      step2.classList.remove("active");

      step3.classList.add("active");

    }


    catch(error){

      if(checkingVoice){

        return;

      }


      setStartStatus(
        "マイクを許可できませんでした。もう一度お試しください。",
        "error"
      );

    }

  }
);



/* =========================================
   練習開始
========================================= */

startButton.addEventListener(
  "click",
  function(){

    if(!voiceChecked){

      setStartStatus(
        "先に「音声を確認」をしてください。",
        "error"
      );

      return;

    }


    startScreen.style.display =
      "none";

    practiceScreen.style.display =
      "block";


    makeQuestionList();

  }
);



/* =========================================
   問題リスト作成
========================================= */

function makeQuestionList(){

  const unit =
    unitSelect.value;


  if(unit === "all"){

    questions =
      [...conversationData];

  }

  else{

    questions =
      conversationData.filter(
        function(item){

          return item.unit === unit;

        }
      );

  }


  questions =
    questions.sort(
      function(){

        return Math.random() - 0.5;

      }
    );


  currentIndex = 0;

  showQuestion();

}



/* =========================================
   問題表示
========================================= */

function showQuestion(){

  stopRecognition();

  speechSynthesis.cancel();

  isJudging = false;


  currentItem =
    questions[currentIndex];


  if(!currentItem){

    return;

  }


  progress.textContent =
    (currentIndex + 1) +
    " / " +
    questions.length;


  questionEnglish.textContent =
    "？？？";


  questionJapanese.textContent =
    "";


  recognizedText.textContent =
    "";


  result.textContent =
    "";


  exampleText.textContent =
    currentItem.example;

  exampleBox.style.display =
    "none";


  speakQuestion(
    function(){

      startRecognition();

    }
  );

}



/* =========================================
   質問読み上げ
========================================= */

function speakQuestion(callback){

  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      currentItem.question
    );


  utterance.lang =
    "en-US";


  utterance.rate =
    getSpeechRate();


  utterance.onend =
    function(){

      if(callback){

        callback();

      }

    };


  speechSynthesis.speak(
    utterance
  );

}



/* =========================================
   もう一回聞く
========================================= */

repeatButton.addEventListener(
  "click",
  function(){

    if(!currentItem){

      return;

    }


    stopRecognition();

    speechSynthesis.cancel();

    isJudging = false;


    questionEnglish.textContent =
      currentItem.question;

    questionJapanese.textContent =
      currentItem.questionJa;


    recognizedText.textContent =
      "";


    result.textContent =
      "";


    exampleBox.style.display =
      "none";


    speakQuestion(
      function(){

        startRecognition();

      }
    );

  }
);



/* =========================================
   音声認識
========================================= */

function createRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "このブラウザでは音声認識を利用できません。Chromeなどでお試しください。"
    );

    return null;

  }


  const rec =
    new SpeechRecognition();


  rec.lang =
    "en-US";


  rec.continuous =
    true;


  rec.interimResults =
    false;


  rec.onresult =
    function(event){

      let text = "";


      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        if(
          event.results[i].isFinal
        ){

          text +=
            event.results[i][0]
              .transcript;

        }

      }


      if(text){

        recognizedText.textContent =
          (
            recognizedText.textContent +
            " " +
            text
          ).trim();

      }

    };


  rec.onend =
    function(){

      if(
        isListening &&
        !isJudging
      ){

        setTimeout(
          function(){

            if(
              isListening &&
              !isJudging
            ){

              try{

                rec.start();

              }
              catch(e){}

            }

          },
          500
        );

      }

    };


  rec.onerror =
    function(event){

      if(
        event.error ===
        "not-allowed"
      ){

        result.textContent =
          "マイクの使用を許可してください。";

      }

    };


  return rec;

}



/* =========================================
   認識開始
========================================= */

function startRecognition(){

  if(!recognition){

    recognition =
      createRecognition();

  }


  if(!recognition){

    return;

  }


  isListening =
    true;


  try{

    recognition.start();

  }

  catch(e){}

}



/* =========================================
   認識停止
========================================= */

function stopRecognition(){

  isListening =
    false;


  if(recognition){

    try{

      recognition.stop();

    }

    catch(e){}

  }

}



/* =========================================
   正規化
========================================= */

function normalize(text){

  return text
    .toLowerCase()
    .replace(/[.,!?'"’“”]/g,"")
    .replace(/\s+/g," ")
    .trim();

}



/* =========================================
   パターン判定
========================================= */

function hasPattern(text){

  const normalized =
    normalize(text);


  const patterns =
    currentItem.patterns ||
    [currentItem.pattern];


  return patterns.some(
    function(pattern){

      return normalized.includes(
        normalize(pattern)
      );

    }
  );

}



/* =========================================
   時間表現
========================================= */

function hasTimeExpression(text){

  const t =
    normalize(text);


  const timePatterns = [

    /*
     * 数字の時刻
     * at 7
     * at 7:30
     */
    /\bat\s+\d{1,2}(?::\d{2})?\b/,

    /*
     * 英語の時刻
     * at seven
     * at seven thirty
     * at ten
     */
    /\bat\s+(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)(\s+(five|ten|fifteen|twenty|twenty-five|thirty|thirty-five|forty|forty-five))?\b/,

    /*
     * noon / midnight / night
     */
    /\bat\s+noon\b/,
    /\bat\s+midnight\b/,
    /\bat\s+night\b/,

    /*
     * 朝・午後・夕方
     */
    /\bin\s+the\s+morning\b/,
    /\bin\s+the\s+afternoon\b/,
    /\bin\s+the\s+evening\b/,

    /*
     * every ～ 
     */
    /\bevery\s+day\b/,
    /\bevery\s+morning\b/,
    /\bevery\s+afternoon\b/,
    /\bevery\s+evening\b/,
    /\bevery\s+night\b/,

    /*
     * 曜日
     */
    /\bon\s+monday\b/,
    /\bon\s+tuesday\b/,
    /\bon\s+wednesday\b/,
    /\bon\s+thursday\b/,
    /\bon\s+friday\b/,
    /\bon\s+saturday\b/,
    /\bon\s+sunday\b/,

    /*
     * today / tomorrow など
     */
    /\btoday\b/,
    /\btomorrow\b/,
    /\btonight\b/,
    /\byesterday\b/

  ];


  return timePatterns.some(
    function(pattern){

      return pattern.test(t);

    }
  );

}



/* =========================================
   場所表現
========================================= */

function hasPlaceExpression(text){

  const t =
    normalize(text);


  /*
   * 時間表現を場所と誤認しない
   */

  if(
    hasTimeExpression(t)
  ){

    return false;

  }


  const placePatterns = [

    /\bin\s+(the|a|my)\s+\w+/,
    /\bat\s+(the|a|my)\s+\w+/,

    /\bat\s+school\b/,
    /\bat\s+home\b/,

    /\bon\s+(the|my|a)\s+\w+/,

    /\bschool\b/,
    /\bhome\b/,
    /\bpark\b/,
    /\blibrary\b/,
    /\bstore\b/,
    /\bshop\b/,
    /\bstation\b/,
    /\bclassroom\b/,
    /\broom\b/,
    /\bhouse\b/,
    /\bfukuoka\b/,
    /\bjapan\b/

  ];


  return placePatterns.some(
    function(pattern){

      return pattern.test(t);

    }
  );

}



/* =========================================
   判定
========================================= */

judgeButton.addEventListener(
  "click",
  function(){

    if(!currentItem){

      return;

    }


    stopRecognition();

    isJudging =
      true;


    const answer =
      normalize(
        recognizedText.textContent
      );


    /*
     * 判定ボタンを押したら
     * 答え方の例を表示する
     */

    exampleBox.style.display =
      "block";


    if(!answer){

      result.textContent =
        "❌ もう一度話してみましょう";


      isJudging =
        false;


      return;

    }


    const patternOK =
      hasPattern(answer);


    let typeOK =
      true;


    if(
      currentItem.answerType ===
      "time"
    ){

      typeOK =
        hasTimeExpression(answer);

    }


    else if(
      currentItem.answerType ===
      "place"
    ){

      typeOK =
        hasPlaceExpression(answer);

    }


    else if(
      currentItem.answerType ===
      "thing"
    ){

      /*
       * What の答えが
       * 明らかな場所・時間だけに
       * なっていないか確認
       */

      if(
        hasTimeExpression(answer)
      ){

        typeOK =
          false;

      }

      else if(
        hasPlaceExpression(answer)
      ){

        typeOK =
          false;

      }

    }


    const correct =
      patternOK &&
      typeOK;


    if(correct){

      result.textContent =
        "◎ いい答えです！";


      /*
       * まず自分の答えを読み上げる。
       * そのあと例文を読み上げる。
       */

      setTimeout(
        function(){

          if(!isJudging){

            return;

          }


          speakUserAnswer(
            function(){

              if(!isJudging){

                return;

              }


              setTimeout(
                function(){

                  if(!isJudging){

                    return;

                  }


                  speakExample();

                },
                500
              );

            }
          );

        },
        1200
      );

    }

    else{

      result.textContent =
        "❌ もう一度練習してみましょう";

    }

  }
);



/* =========================================
   自分の答え読み上げ
========================================= */

function speakUserAnswer(callback){

  speechSynthesis.cancel();


  const answer =
    recognizedText.textContent.trim();


  if(!answer){

    if(callback){

      callback();

    }

    return;

  }


  const utterance =
    new SpeechSynthesisUtterance(
      answer
    );


  utterance.lang =
    "en-US";


  utterance.rate =
    getSpeechRate();


  utterance.onend =
    function(){

      if(callback){

        callback();

      }

    };


  utterance.onerror =
    function(){

      if(callback){

        callback();

      }

    };


  speechSynthesis.speak(
    utterance
  );

}



/* =========================================
   例文読み上げ
========================================= */

function speakExample(){

  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      currentItem.example
    );


  utterance.lang =
    "en-US";


  utterance.rate =
    getSpeechRate();


  speechSynthesis.speak(
    utterance
  );

}

nextButton.addEventListener(

  function(){

    speechSynthesis.cancel();

    stopRecognition();

    isJudging =
      false;


    currentIndex++;


    if(
      currentIndex >=
      questions.length
    ){

      currentIndex =
        0;


      questions =
        questions.sort(
          function(){

            return Math.random() - 0.5;

          }
        );

    }


    showQuestion();

  }
);



/* =========================================
   速度
========================================= */

function getSpeechRate(){

  const selected =
    document.querySelector(
      'input[name="speed"]:checked'
    );


  return selected
    ? Number(selected.value)
    : 1.0;

}
