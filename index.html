<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALTと話そう！英会話トレーニング</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f0e8;
  color:#333;
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

.container{
  width:92%;
  max-width:700px;
  margin:0 auto;
  padding:30px 0 50px;
}

/* =========================
   スタート画面
========================= */

.startCard{
  background:#fff;
  border-radius:20px;
  padding:35px 25px 30px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
  text-align:center;
}

.title{
  color:#7b3fc6;
  font-size:32px;
  font-weight:bold;
  margin:0;
}

.subtitle{
  font-size:20px;
  font-weight:bold;
  margin-top:5px;
  margin-bottom:25px;
}

.description{
  font-size:18px;
  line-height:1.8;
  margin-bottom:30px;
}

.steps{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:25px;
}

.step{
  border:2px solid #ddd;
  border-radius:12px;
  padding:14px;
  font-size:17px;
  font-weight:bold;
  background:#fafafa;
}

.step.active{
  border-color:#7b3fc6;
  background:#f6efff;
  color:#7b3fc6;
}

.step.done{
  border-color:#aaa;
  background:#f5f5f5;
  color:#555;
}

button{
  border:none;
  border-radius:12px;
  padding:14px 25px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:#7b3fc6;
  color:white;
}

button:hover{
  opacity:0.9;
}

button:disabled{
  background:#ccc;
  cursor:not-allowed;
}

.status{
  min-height:30px;
  margin-top:18px;
  font-size:16px;
  line-height:1.6;
}

/* =========================
   練習画面
========================= */

#practice{
  display:none;
}

.practiceHeader{
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 15px rgba(0,0,0,0.07);
  margin-bottom:18px;
}

.practiceHeader select{
  font-size:16px;
  padding:9px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  background:white;
}

.progress{
  margin-top:12px;
  font-size:15px;
  color:#666;
}

.questionCard{
  background:#fff;
  border-radius:20px;
  padding:30px 22px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
  text-align:center;
}

.questionLabel{
  color:#7b3fc6;
  font-weight:bold;
  font-size:18px;
  margin-bottom:18px;
}

.questionEnglish{
  font-size:28px;
  font-weight:bold;
  line-height:1.5;
  min-height:42px;
  margin-bottom:8px;
}

.questionJapanese{
  font-size:18px;
  color:#666;
  min-height:28px;
  margin-bottom:25px;
}

.recognizedTitle{
  font-size:15px;
  color:#777;
  margin-top:10px;
}

.recognizedAnswer{
  min-height:34px;
  font-size:20px;
  font-weight:bold;
  line-height:1.5;
  margin:5px 0 15px;
  padding:8px;
  border-bottom:2px solid #ddd;
}

.result{
  min-height:35px;
  font-size:22px;
  font-weight:bold;
  margin:15px 0;
}

.exampleBox{
  display:none;
  margin-top:20px;
  padding:16px;
  border-radius:12px;
  background:#f6efff;
  border-left:5px solid #7b3fc6;
  text-align:left;
}

.exampleTitle{
  font-size:15px;
  color:#7b3fc6;
  font-weight:bold;
  margin-bottom:7px;
}

.exampleText{
  font-size:20px;
  font-weight:bold;
  line-height:1.5;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.controls button{
  min-width:120px;
}

.speedBox{
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid #ddd;
  font-size:15px;
}

.speedBox label{
  margin:0 8px;
  cursor:pointer;
}

/* =========================
   スマホ
========================= */

@media(max-width:600px){

  .container{
    width:94%;
    padding-top:18px;
  }

  .startCard{
    padding:28px 18px;
  }

  .title{
    font-size:28px;
  }

  .subtitle{
    font-size:18px;
  }

  .description{
    font-size:16px;
  }

  .questionCard{
    padding:24px 15px;
  }

  .questionEnglish{
    font-size:24px;
  }

  .questionJapanese{
    font-size:17px;
  }

  .controls button{
    width:100%;
  }

}

</style>
</head>


<body>

<div class="container">

  <!-- =========================
       スタート画面
  ========================== -->

  <div id="startScreen" class="startCard">

    <h1 class="title">ALTと話そう！</h1>

    <div class="subtitle">
      英会話トレーニング
    </div>

    <div class="description">
      英語の質問を聞いて、<br>
      英語で答えてみましょう。
    </div>


    <div class="steps">

      <div id="step1" class="step active">
        ① 音声を確認
      </div>

      <div id="step2" class="step">
        ② マイクを許可
      </div>

      <div id="step3" class="step">
        ③ 練習スタート
      </div>

    </div>


    <button id="voiceButton">
      音声を確認
    </button>

    <button
      id="micButton"
      style="display:none;"
    >
      マイクを許可
    </button>

    <br>

    <button
      id="startButton"
      style="display:none;"
      disabled
    >
      練習を始める
    </button>

    <div id="status" class="status"></div>

  </div>


  <!-- =========================
       練習画面
  ========================== -->

  <div id="practice">

    <div class="practiceHeader">

      <select id="unitSelect">

        <option value="all">
          すべて
        </option>

        <option value="What">
          What
        </option>

        <option value="Where">
          Where
        </option>

        <option value="When">
          When
        </option>

      </select>

      <div id="progress" class="progress"></div>

    </div>


    <div class="questionCard">

      <div class="questionLabel">
        英語で答えてみよう！
      </div>

      <div
        id="questionEnglish"
        class="questionEnglish"
      >
        ？？？
      </div>

      <div
        id="questionJapanese"
        class="questionJapanese"
      ></div>


      <div class="recognizedTitle">
        あなたの答え
      </div>

      <div
        id="recognizedAnswer"
        class="recognizedAnswer"
      ></div>


      <div
        id="result"
        class="result"
      ></div>


      <div
        id="exampleBox"
        class="exampleBox"
      >

        <div class="exampleTitle">
          答え方の例
        </div>

        <div
          id="exampleText"
          class="exampleText"
        ></div>

      </div>


      <div class="controls">

        <button id="judgeButton">
          判定
        </button>

        <button id="nextButton">
          次の問題
        </button>

        <button id="repeatButton">
          もう一回聞く
        </button>

      </div>


      <div class="speedBox">

        音声の速さ　

        <label>
          <input
            type="radio"
            name="speed"
            value="1"
            checked
          >
          ナチュラル
        </label>

        <label>
          <input
            type="radio"
            name="speed"
            value="0.75"
          >
          ゆっくり
        </label>

      </div>

    </div>

  </div>

</div>


<script src="conversationData.js"></script>

<script>

/* =========================
   基本変数
========================= */

let questions = [];
let currentIndex = 0;
let currentItem = null;

let recognition = null;

let isListening = false;
let isJudging = false;

let voiceChecked = false;
let checkingVoice = false;


/* =========================
   要素
========================= */

const startScreen =
  document.getElementById("startScreen");

const practice =
  document.getElementById("practice");

const voiceButton =
  document.getElementById("voiceButton");

const micButton =
  document.getElementById("micButton");

const startButton =
  document.getElementById("startButton");

const status =
  document.getElementById("status");

const step1 =
  document.getElementById("step1");

const step2 =
  document.getElementById("step2");

const step3 =
  document.getElementById("step3");

const unitSelect =
  document.getElementById("unitSelect");

const progress =
  document.getElementById("progress");

const questionEnglish =
  document.getElementById("questionEnglish");

const questionJapanese =
  document.getElementById("questionJapanese");

const recognizedText =
  document.getElementById("recognizedAnswer");

const result =
  document.getElementById("result");

const exampleBox =
  document.getElementById("exampleBox");

const exampleText =
  document.getElementById("exampleText");

const judgeButton =
  document.getElementById("judgeButton");

const nextButton =
  document.getElementById("nextButton");

const repeatButton =
  document.getElementById("repeatButton");


/* =========================
   ステップ表示
========================= */

function showStep(step){

  step1.classList.remove("active");
  step2.classList.remove("active");
  step3.classList.remove("active");

  step1.classList.remove("done");
  step2.classList.remove("done");
  step3.classList.remove("done");

  if(step === 1){

    step1.classList.add("active");

  }

  if(step === 2){

    step1.classList.add("done");
    step2.classList.add("active");

  }

  if(step === 3){

    step1.classList.add("done");
    step2.classList.add("done");
    step3.classList.add("active");

  }

}


/* =========================
   音声確認
========================= */

voiceButton.addEventListener(
  "click",
  function(){

    if(checkingVoice) return;

    checkingVoice = true;

    status.textContent =
      "音声確認中。しばらくおまちください・・・";

    voiceButton.disabled = true;

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance("Hello.");

    utterance.lang = "en-US";
    utterance.rate = 1.0;

    utterance.onend = function(){

      checkingVoice = false;

      voiceChecked = true;

      voiceButton.style.display = "none";

      micButton.style.display = "inline-block";

      showStep(2);

      status.textContent =
        "音声を確認しました。次に「マイクを許可」を押してください。";

    };

    utterance.onerror = function(){

      checkingVoice = false;

      voiceButton.disabled = false;

      status.textContent =
        "音声の確認ができませんでした。もう一度押してください。";

    };

    speechSynthesis.speak(utterance);

  }
);


/* =========================
   マイク許可
========================= */

micButton.addEventListener(
  "click",
  async function(){

    if(checkingVoice) return;

    try{

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });

      stream.getTracks().forEach(
        function(track){
          track.stop();
        }
      );

      micButton.style.display = "none";

      startButton.style.display = "inline-block";

      startButton.disabled = false;

      showStep(3);

      status.textContent =
        "マイクを許可しました。練習を始めましょう。";

    }
    catch(error){

      status.textContent =
        "マイクの使用を許可してください。";

    }

  }
);


/* =========================
   練習スタート
========================= */

startButton.addEventListener(
  "click",
  function(){

    if(!voiceChecked) return;

    startScreen.style.display = "none";

    practice.style.display = "block";

    makeQuestionList();

  }
);


/* =========================
   問題リスト作成
========================= */

function makeQuestionList(){

  const unit =
    unitSelect.value;

  if(unit === "all"){

    questions =
      conversationData.slice();

  }
  else{

    questions =
      conversationData.filter(
        function(item){
          return item.unit === unit;
        }
      );

  }

  questions.sort(
    function(){
      return Math.random() - 0.5;
    }
  );

  currentIndex = 0;

  showQuestion();

}


/* =========================
   問題表示
========================= */

function showQuestion(){

  stopRecognition();

  speechSynthesis.cancel();

  isJudging = false;

  currentItem =
    questions[currentIndex];

  if(!currentItem) return;


  progress.textContent =
    (currentIndex + 1) +
    " / " +
    questions.length;


  questionEnglish.textContent =
    "？？？";

  questionJapanese.textContent =
    "";

  recognizedText.textContent =
    "";

  result.textContent =
    "";

  exampleText.textContent =
    currentItem.example;

  exampleBox.style.display =
    "none";


  speakQuestion(
    function(){
      startRecognition();
    }
  );

}


/* =========================
   質問を読み上げる
========================= */

function speakQuestion(callback){

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      currentItem.question
    );

  utterance.lang = "en-US";

  const speed =
    document.querySelector(
      'input[name="speed"]:checked'
    ).value;

  utterance.rate =
    Number(speed);

  utterance.onend = function(){

    if(callback){
      callback();
    }

  };

  speechSynthesis.speak(
    utterance
  );

}


/* =========================
   音声認識
========================= */

function createRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "このブラウザでは音声認識を利用できません。Chromeなどでお試しください。"
    );

    return null;

  }


  const rec =
    new SpeechRecognition();

  rec.lang = "en-US";

  rec.continuous = true;

  rec.interimResults = false;


  rec.onresult = function(event){

    let text = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      if(
        event.results[i].isFinal
      ){

        text +=
          event.results[i][0].transcript;

      }

    }


    /*
      新しく認識した答えで
      前の答えを置き換える。
    */

    if(text){

      recognizedText.textContent =
        text.trim();

    }

  };


  rec.onend = function(){

    if(
      isListening &&
      !isJudging
    ){

      setTimeout(
        function(){

          if(
            isListening &&
            !isJudging
          ){

            try{

              rec.start();

            }
            catch(e){}

          }

        },
        500
      );

    }

  };


  rec.onerror = function(event){

    if(
      event.error === "not-allowed"
    ){

      result.textContent =
        "マイクの使用を許可してください。";

    }

  };


  return rec;

}


/* =========================
   音声認識スタート
========================= */

function startRecognition(){

  if(isJudging) return;

  stopRecognition();

  recognition =
    createRecognition();

  if(!recognition) return;

  isListening = true;

  try{

    recognition.start();

  }
  catch(e){}

}


/* =========================
   音声認識ストップ
========================= */

function stopRecognition(){

  isListening = false;

  if(recognition){

    try{

      recognition.stop();

    }
    catch(e){}

  }

}


/* =========================
   正規化
========================= */

function normalize(text){

  return text
    .toLowerCase()
    .replace(
      /[.,!?'"’“”]/g,
      ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}


/* =========================
   パターン後の答え
========================= */

function getAnswerAfterPattern(text){

  const normalized =
    normalize(text);

  const patterns =
    currentItem.patterns ||
    [currentItem.pattern];


  for(
    let i = 0;
    i < patterns.length;
    i++
  ){

    const pattern =
      normalize(patterns[i]);


    if(
      normalized.startsWith(pattern)
    ){

      const rest =
        normalized
          .slice(pattern.length)
          .trim();


      if(rest.length > 0){

        return rest;

      }

    }

  }


  return "";

}


/* =========================
   パターン判定
========================= */

function hasPattern(text){

  return (
    getAnswerAfterPattern(text).length > 0
  );

}


/* =========================
   時間表現
========================= */

function hasTimeExpression(text){

  const t =
    normalize(text);


  if(
    /\bat\s+\d{1,2}(:\d{1,2})?\b/.test(t)
  ){
    return true;
  }


  const timeWords = [
    "one",
    "two",
    "three",
    "four",
    "five",
    "six",
    "seven",
    "eight",
    "nine",
    "ten",
    "eleven",
    "twelve"
  ];


  for(
    let i = 0;
    i < timeWords.length;
    i++
  ){

    if(
      t.includes(
        "at " + timeWords[i]
      )
    ){

      return true;

    }

  }


  const expressions = [

    "noon",
    "midnight",
    "at night",

    "in the morning",
    "in the afternoon",
    "in the evening",

    "every day",
    "every morning",
    "every afternoon",
    "every evening",
    "every night",

    "on monday",
    "on tuesday",
    "on wednesday",
    "on thursday",
    "on friday",
    "on saturday",
    "on sunday",

    "after school",
    "before school",
    "after dinner",
    "before dinner",

    "today",
    "tomorrow",
    "tonight",
    "yesterday"

  ];


  for(
    let i = 0;
    i < expressions.length;
    i++
  ){

    if(
      t.includes(expressions[i])
    ){

      return true;

    }

  }


  return false;

}


/* =========================
   場所表現
========================= */

function hasPlaceExpression(text){

  const t =
    normalize(text);


  if(hasTimeExpression(t)){
    return false;
  }


  if(
    /\bin\s+[a-z]+/.test(t)
  ){

    return true;

  }


  if(
    /\bat\s+[a-z]+/.test(t)
  ){

    const placeWords = [

      "school",
      "home",
      "the park",
      "the library",
      "the store",
      "the shop",
      "the station",
      "school",
      "home",
      "classroom",
      "room",
      "fukuoka",
      "japan"

    ];


    for(
      let i = 0;
      i < placeWords.length;
      i++
    ){

      if(
        t.includes(
          "at " + placeWords[i]
        )
      ){

        return true;

      }

    }

  }


  if(
    /\bon\s+[a-z]+/.test(t)
  ){

    return true;

  }


  if(
    /\bto\s+[a-z]+/.test(t)
  ){

    return true;

  }


  if(
    /\bnear\s+[a-z]+/.test(t)
  ){

    return true;

  }


  const knownPlaces = [

    "school",
    "home",
    "park",
    "library",
    "store",
    "shop",
    "station",
    "classroom",
    "room",
    "house",
    "fukuoka",
    "japan"

  ];


  /*
    「home」を「homework」の一部として
    誤認しないようにする。
    
    単語の前後が単語の境目になっている場合だけ
    場所として認識する。
  */

  for(
    let i = 0;
    i < knownPlaces.length;
    i++
  ){

    const placePattern =
      new RegExp(
        "\\b" +
        knownPlaces[i] +
        "\\b"
      );

    if(
      placePattern.test(t)
    ){

      return true;

    }

  }


  return false;

}


/* =========================
   答えの種類
========================= */

function checkAnswerType(answer){

  const type =
    currentItem.answerType;


  if(type === "time"){

    return hasTimeExpression(
      answer
    );

  }


  if(type === "place"){

    return hasPlaceExpression(
      answer
    );

  }


  if(type === "thing"){

    if(!answer){
      return false;
    }


    if(hasTimeExpression(answer)){
      return false;
    }


    if(hasPlaceExpression(answer)){
      return false;
    }


    return true;

  }


  return answer.length > 0;

}


/* =========================
   判定
========================= */

judgeButton.addEventListener(
  "click",
  function(){

    if(!currentItem) return;

    stopRecognition();

    isJudging = true;


    const answer =
      normalize(
        recognizedText.textContent
      );


    exampleBox.style.display =
      "block";


    if(!answer){

      result.textContent =
        "❌ もう一度話してみましょう";

      isJudging = false;

      return;

    }


    const patternOK =
      hasPattern(answer);

    const typeOK =
      checkAnswerType(
        getAnswerAfterPattern(answer)
      );

    const correct =
      patternOK &&
      typeOK;


    if(correct){

      result.textContent =
        "◎ いい答えです！";


      setTimeout(
        function(){

          if(!isJudging) return;

          speakUserAnswer(
            function(){

              if(!isJudging) return;


              setTimeout(
                function(){

                  if(!isJudging) return;

                  speakExample();

                },
                500
              );

            }
          );

        },
        1200
      );

    }
    else{

      result.textContent =
        "❌ もう一度練習してみましょう";

    }

  }
);


/* =========================
   自分の答えを読み上げる
========================= */

function speakUserAnswer(callback){

  speechSynthesis.cancel();


  const text =
    recognizedText.textContent;


  if(!text){

    if(callback){
      callback();
    }

    return;

  }


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  utterance.lang = "en-US";


  const speed =
    document.querySelector(
      'input[name="speed"]:checked'
    ).value;


  utterance.rate =
    Number(speed);


  utterance.onend =
    function(){

      if(callback){
        callback();
      }

    };


  speechSynthesis.speak(
    utterance
  );

}


/* =========================
   正解例を読み上げる
========================= */

function speakExample(){

  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      currentItem.example
    );


  utterance.lang = "en-US";


  const speed =
    document.querySelector(
      'input[name="speed"]:checked'
    ).value;


  utterance.rate =
    Number(speed);


  speechSynthesis.speak(
    utterance
  );

}


/* =========================
   次の問題
========================= */

nextButton.addEventListener(
  "click",
  function(){

    isJudging = false;

    stopRecognition();

    speechSynthesis.cancel();

    currentIndex++;


    if(
      currentIndex >= questions.length
    ){

      currentIndex = 0;

      questions.sort(
        function(){
          return Math.random() - 0.5;
        }
      );

    }


    showQuestion();

  }
);


/* =========================
   もう一回聞く
========================= */

repeatButton.addEventListener(
  "click",
  function(){

    if(!currentItem) return;


    stopRecognition();

    speechSynthesis.cancel();

    isJudging = false;


    questionEnglish.textContent =
      currentItem.question;

    questionJapanese.textContent =
      currentItem.questionJa;


    recognizedText.textContent =
      "";

    result.textContent =
      "";

    exampleBox.style.display =
      "none";


    speakQuestion(
      function(){

        startRecognition();

      }
    );

  }
);


/* =========================
   単元変更
========================= */

unitSelect.addEventListener(
  "change",
  function(){

    makeQuestionList();

  }
);

</script>

</body>
</html>
